version: '3.8'

# Nota: Este docker-compose é usado apenas para desenvolvimento local.
# Em produção, o Backend e Frontend são hospedados na Vercel,
# e o banco de dados é o Supabase (PostgreSQL na nuvem).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tickeven-backend
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: tickeven-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
